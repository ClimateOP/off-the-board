<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Off The Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #07080d;
        --panel: #10131c;
        --panel-2: #171b27;
        --line: #242a3a;
        --ink: #e7e9f2;
        --ink-dim: #8991a8;
        --blue: #3f7fc4;
        --green: #3fae74;
        --black-word: #c23b3b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: var(--void);
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
      }
      .screen {
        height: 100vh;
        width: 100vw;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background:
          radial-gradient(
            ellipse at 20% -10%,
            rgba(63, 127, 196, 0.09),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 110%,
            rgba(194, 59, 59, 0.07),
            transparent 45%
          ),
          var(--void);
      }
      .screen.active {
        display: flex;
      }

      h1.title {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        letter-spacing: 0.05em;
        font-size: 44px;
        margin: 0 0 48px;
        text-align: center;
      }
      h1.title span {
        color: var(--black-word);
      }

      .choice-row {
        display: flex;
        gap: 22px;
      }
      .choice-card {
        width: 220px;
        padding: 30px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .choice-card:hover {
        border-color: var(--blue);
        transform: translateY(-2px);
      }
      .choice-card .big {
        font-family: 'Cinzel', serif;
        font-size: 22px;
        margin-bottom: 8px;
      }
      .choice-card .sub {
        font-size: 13px;
        color: var(--ink-dim);
      }

      .player-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 340px;
      }
      .player-row {
        padding: 16px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .player-row:hover {
        border-color: var(--blue);
      }
      .player-row .pname {
        font-size: 18px;
      }
      .role-tag {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 2px;
      }
      .role-tag.spirit {
        background: #1c3350;
        color: #8ec1f0;
      }
      .role-tag.soul {
        background: var(--panel-2);
        color: var(--ink-dim);
        border: 1px solid var(--line);
      }

      .backlink {
        margin-top: 34px;
        font-size: 12px;
        color: var(--ink-dim);
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
      }
      .backlink:hover {
        color: var(--ink);
      }

      /* GAME SCREEN */
      #gameScreen {
        align-items: stretch;
        justify-content: flex-start;
        padding: 28px 40px;
        position: relative;
      }
      .game-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 22px;
      }
      .names-block {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
      }
      .name-chip {
        font-size: 15px;
        color: var(--ink-dim);
        font-family: 'IBM Plex Mono', monospace;
      }
      .name-chip b {
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 16px;
        font-weight: 600;
      }
      .name-chip.me b {
        color: var(--blue);
      }

      .timer-box {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 46px;
        padding: 4px 22px;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
        background: var(--panel);
        min-width: 110px;
        text-align: center;
      }
      .timer-box.paused {
        color: var(--ink-dim);
        border-color: var(--ink-dim);
      }
      .timer-box.low {
        color: var(--black-word);
        border-color: var(--black-word);
      }

      .dots {
        position: absolute;
        top: 26px;
        right: 40px;
        font-size: 26px;
        color: var(--ink-dim);
        cursor: pointer;
        padding: 4px 10px;
        letter-spacing: 2px;
        line-height: 1;
      }
      .dots:hover {
        color: var(--ink);
      }

      .board {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 12px;
        height: calc(100vh - 190px);
      }
      .cell {
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
        font-size: 26px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--ink);
        letter-spacing: 0.01em;
      }
      .cell.blue {
        background: linear-gradient(160deg, var(--blue), #2a5c8f);
        color: #eef5ff;
        border-color: #2a5c8f;
      }
      .cell.green {
        background: linear-gradient(160deg, var(--green), #2b7d55);
        color: #eafff2;
        border-color: #2b7d55;
      }
      .cell.black {
        background: linear-gradient(160deg, #1a1010, #000);
        color: var(--black-word);
        border-color: #3a1616;
        box-shadow: 0 0 16px rgba(194, 59, 59, 0.18) inset;
      }

      /* EDIT MODAL */
      #editOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5, 6, 10, 0.88);
        z-index: 50;
        overflow-y: auto;
        padding: 40px;
      }
      #editOverlay.active {
        display: block;
      }
      .edit-panel {
        max-width: 900px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 28px 32px 36px;
      }
      .edit-panel h2 {
        font-family: 'Cinzel', serif;
        font-size: 20px;
        margin: 0 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .edit-close {
        font-size: 22px;
        color: var(--ink-dim);
        cursor: pointer;
      }
      .edit-close:hover {
        color: var(--ink);
      }
      .edit-section {
        margin-bottom: 26px;
      }
      .edit-section h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink-dim);
        margin: 0 0 12px;
        font-family: 'IBM Plex Mono', monospace;
      }
      .edit-grid-names {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .edit-field label {
        display: block;
        font-size: 11px;
        color: var(--ink-dim);
        margin-bottom: 4px;
      }
      input[type='text'],
      input[type='number'] {
        width: 100%;
        background: var(--void);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 8px 10px;
        border-radius: 3px;
        font-size: 13px;
      }
      input[type='text']:focus,
      input[type='number']:focus {
        outline: none;
        border-color: var(--blue);
      }

      .setup-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .setup-cell input {
        font-size: 11px;
        text-align: center;
        padding: 6px 4px;
      }
      .swatches {
        display: flex;
        justify-content: center;
        gap: 3px;
        margin-top: 4px;
      }
      .sw {
        width: 15px;
        height: 15px;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .sw.blue {
        background: var(--blue);
      }
      .sw.green {
        background: var(--green);
      }
      .sw.black {
        background: #3a1616;
      }
      .sw.neutral {
        background: var(--panel-2);
      }
      .sw.active {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }
      .counts {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--ink-dim);
        margin-bottom: 10px;
        font-family: 'IBM Plex Mono', monospace;
      }
      .counts b {
        color: var(--ink);
      }

      .edit-row-btns {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }
      button.btn {
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 9px 16px;
        border-radius: 3px;
        font-size: 12.5px;
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
      }
      button.btn:hover {
        border-color: var(--blue);
      }
      button.btn.danger:hover {
        border-color: var(--black-word);
      }
    </style>
  </head>
  <body>
    <!-- MODE SELECT -->
    <div class="screen active" id="modeScreen">
      <h1 class="title">OFF THE <span>BOARD</span></h1>
      <div class="choice-row">
        <div class="choice-card" data-mode="duo">
          <div class="big">Duo</div>
          <div class="sub">2 players</div>
        </div>
        <div class="choice-card" data-mode="team">
          <div class="big">Team</div>
          <div class="sub">6 players</div>
        </div>
      </div>
    </div>

    <!-- PLAYER SELECT -->
    <div class="screen" id="playerScreen">
      <h1 class="title" style="font-size: 30px; margin-bottom: 34px">
        Who's playing?
      </h1>
      <div class="player-list" id="playerList"></div>
      <div class="backlink" id="backToMode">&larr; change mode</div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="game-top">
        <div class="names-block" id="namesBlock"></div>
        <div class="timer-box" id="timerBox">60</div>
      </div>
      <div class="board" id="board"></div>
      <div class="dots" id="dotsMenu">&#8942;</div>
    </div>

    <!-- EDIT OVERLAY -->
    <div id="editOverlay">
      <div class="edit-panel">
        <h2>Edit <span class="edit-close" id="editClose">&times;</span></h2>

        <div class="edit-section" id="namesEditSection">
          <h3>Player Names</h3>
          <div class="edit-grid-names" id="namesEditGrid"></div>
        </div>

        <div class="edit-section">
          <h3>Board — words &amp; true colors</h3>
          <div class="counts" id="countsBar"></div>
          <div class="setup-grid" id="setupGrid"></div>
        </div>

        <div class="edit-section">
          <h3>Timer duration (seconds)</h3>
          <input
            type="number"
            id="timerDurationInput"
            style="max-width: 140px"
            min="5"
          />
        </div>

        <div class="edit-row-btns">
          <button class="btn" id="backToPlayerSelect">
            Change player / mode
          </button>
          <button class="btn danger" id="clearReveals">
            Clear revealed cells
          </button>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_WORDS = [
        'LOGICAL',
        'OR',
        'BED',
        'DEATH',
        'SITUATION',
        'WIN',
        'PALM',
        'FACE',
        'VESSEL',
        'COOK',
        'DUO',
        'THINKING',
        'GRENADE',
        'HAND',
        'FURNITURE',
        'STICKY',
        'MYTH',
        'MORSE',
        'SIGNAL',
        'BOARD',
        'SPIRIT',
        'SOUL',
        'RECORDING',
        'BROWSER',
        'JACKET',
      ];

      // fixed, deterministic default layout (not randomized) so retakes stay consistent
      const DEFAULT_COLORS = [
        'blue',
        'green',
        'blue',
        'black',
        'green',
        'green',
        'blue',
        'neutral',
        'blue',
        'green',
        'black',
        'neutral',
        'green',
        'blue',
        'neutral',
        'green',
        'black',
        'blue',
        'neutral',
        'green',
        'blue',
        'neutral',
        'black',
        'blue',
        'green',
      ];

      let state = {
        mode: 'team',
        names: {
          duo: { p1: 'Alpha', p2: 'Beta' },
          team: {
            t1: { spirit: 'Alpha', soul1: 'Theta', soul2: 'Delta' },
            t2: { spirit: 'Beta', soul1: 'Epsilon', soul2: 'Gamma' },
          },
        },
        words: DEFAULT_WORDS.slice(),
        colors: DEFAULT_COLORS.slice(),
        revealed: Array(25).fill(false),
        selectedPlayer: null,
        timer: { total: 60, remaining: 60, running: false, intervalId: null },
      };

      function getRoster() {
        if (state.mode === 'duo') {
          return [
            { id: 'p1', name: state.names.duo.p1, role: 'spirit', team: 'A' },
            { id: 'p2', name: state.names.duo.p2, role: 'soul', team: 'A' },
          ];
        }
        return [
          {
            id: 't1-spirit',
            name: state.names.team.t1.spirit,
            role: 'spirit',
            team: '1',
          },
          {
            id: 't1-soul1',
            name: state.names.team.t1.soul1,
            role: 'soul',
            team: '1',
          },
          {
            id: 't1-soul2',
            name: state.names.team.t1.soul2,
            role: 'soul',
            team: '1',
          },
          {
            id: 't2-spirit',
            name: state.names.team.t2.spirit,
            role: 'spirit',
            team: '2',
          },
          {
            id: 't2-soul1',
            name: state.names.team.t2.soul1,
            role: 'soul',
            team: '2',
          },
          {
            id: 't2-soul2',
            name: state.names.team.t2.soul2,
            role: 'soul',
            team: '2',
          },
        ];
      }

      function showScreen(id) {
        document
          .querySelectorAll('.screen')
          .forEach((s) => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      // ---- Mode select ----
      document.querySelectorAll('.choice-card').forEach((card) => {
        card.addEventListener('click', () => {
          state.mode = card.dataset.mode;
          renderPlayerList();
          showScreen('playerScreen');
        });
      });

      // ---- Player select ----
      function renderPlayerList() {
        const list = document.getElementById('playerList');
        const roster = getRoster();
        list.innerHTML = roster
          .map(
            (p) => `
    <div class="player-row" data-id="${p.id}">
      <span class="pname">${p.name}</span>
      <span class="role-tag ${p.role}">${p.role.toUpperCase()}</span>
    </div>
  `,
          )
          .join('');
        list.querySelectorAll('.player-row').forEach((row) => {
          row.addEventListener('click', () => {
            state.selectedPlayer = row.dataset.id;
            enterGame();
          });
        });
      }
      document
        .getElementById('backToMode')
        .addEventListener('click', () => showScreen('modeScreen'));
      document
        .getElementById('backToPlayerSelect')
        .addEventListener('click', () => {
          closeEdit();
          renderPlayerList();
          showScreen('playerScreen');
        });

      // ---- Game screen ----
      function enterGame() {
        renderNames();
        renderBoard();
        showScreen('gameScreen');
      }

      function renderNames() {
        const roster = getRoster();
        const me = roster.find((p) => p.id === state.selectedPlayer);
        document.getElementById('namesBlock').innerHTML = roster
          .map(
            (p) => `
    <span class="name-chip ${p.id === me.id ? 'me' : ''}"><b>${p.name}</b></span>
  `,
          )
          .join('');
      }

      function renderBoard() {
        const roster = getRoster();
        const player =
          roster.find((p) => p.id === state.selectedPlayer) || roster[0];
        const isSpirit = player.role === 'spirit';
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 0; i < 25; i++) {
          const cell = document.createElement('div');
          const isRevealed = state.revealed[i];
          let cls = '';
          if (isSpirit || isRevealed) {
            cls = state.colors[i] === 'neutral' ? '' : state.colors[i];
          }
          cell.className = 'cell ' + cls;
          cell.textContent = state.words[i];
          cell.addEventListener('click', () => {
            state.revealed[i] = !state.revealed[i];
            renderBoard();
          });
          board.appendChild(cell);
        }
      }

      // ---- Timer: click to pause/resume, loops on reaching zero ----
      const timerBox = document.getElementById('timerBox');
      function updateTimerBox() {
        timerBox.textContent = state.timer.remaining;
        timerBox.classList.toggle(
          'low',
          state.timer.remaining <= 10 && state.timer.running,
        );
        timerBox.classList.toggle('paused', !state.timer.running);
      }
      function tick() {
        if (state.timer.remaining > 0) {
          state.timer.remaining -= 1;
        } else {
          state.timer.remaining = state.timer.total; // loop, never hard-stops
        }
        updateTimerBox();
      }
      function startTimer() {
        if (state.timer.running) return;
        state.timer.running = true;
        state.timer.intervalId = setInterval(tick, 1000);
        updateTimerBox();
      }
      function pauseTimer() {
        clearInterval(state.timer.intervalId);
        state.timer.running = false;
        updateTimerBox();
      }
      timerBox.addEventListener('click', () => {
        if (state.timer.running) pauseTimer();
        else startTimer();
      });

      // ---- Edit overlay ----
      const editOverlay = document.getElementById('editOverlay');
      document.getElementById('dotsMenu').addEventListener('click', openEdit);
      document.getElementById('editClose').addEventListener('click', closeEdit);
      function openEdit() {
        pauseTimer();
        renderNamesEdit();
        renderSetupGrid();
        document.getElementById('timerDurationInput').value = state.timer.total;
        editOverlay.classList.add('active');
      }
      function closeEdit() {
        editOverlay.classList.remove('active');
        renderNames();
        renderBoard();
      }

      function renderNamesEdit() {
        const box = document.getElementById('namesEditGrid');
        if (state.mode === 'duo') {
          box.innerHTML = `
      <div class="edit-field"><label>Player 1 (Spirit)</label><input type="text" data-path="duo.p1" value="${state.names.duo.p1}"></div>
      <div class="edit-field"><label>Player 2 (Soul)</label><input type="text" data-path="duo.p2" value="${state.names.duo.p2}"></div>
    `;
        } else {
          box.innerHTML = `
      <div class="edit-field"><label>Team 1 — Spirit</label><input type="text" data-path="team.t1.spirit" value="${state.names.team.t1.spirit}"></div>
      <div class="edit-field"><label>Team 1 — Soul</label><input type="text" data-path="team.t1.soul1" value="${state.names.team.t1.soul1}"></div>
      <div class="edit-field"><label>Team 1 — Soul</label><input type="text" data-path="team.t1.soul2" value="${state.names.team.t1.soul2}"></div>
      <div class="edit-field"><label>Team 2 — Spirit</label><input type="text" data-path="team.t2.spirit" value="${state.names.team.t2.spirit}"></div>
      <div class="edit-field"><label>Team 2 — Soul</label><input type="text" data-path="team.t2.soul1" value="${state.names.team.t2.soul1}"></div>
      <div class="edit-field"><label>Team 2 — Soul</label><input type="text" data-path="team.t2.soul2" value="${state.names.team.t2.soul2}"></div>
    `;
        }
        box.querySelectorAll('input').forEach((inp) => {
          inp.addEventListener('input', (e) => {
            const path = e.target.dataset.path.split('.');
            let ref = state.names;
            for (let i = 0; i < path.length - 1; i++) ref = ref[path[i]];
            ref[path[path.length - 1]] = e.target.value;
          });
        });
      }

      function renderCounts() {
        const c = { blue: 0, green: 0, black: 0, neutral: 0 };
        state.colors.forEach((col) => c[col]++);
        document.getElementById('countsBar').innerHTML =
          `<span>Blue: <b>${c.blue}</b></span><span>Green: <b>${c.green}</b></span><span>Off the board: <b>${c.black}</b></span><span>Neutral: <b>${c.neutral}</b></span>`;
      }

      function renderSetupGrid() {
        const grid = document.getElementById('setupGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
          const cell = document.createElement('div');
          cell.className = 'setup-cell';
          cell.innerHTML = `
      <input type="text" data-i="${i}" class="wordInput" value="${state.words[i]}">
      <div class="swatches">
        <div class="sw blue ${state.colors[i] === 'blue' ? 'active' : ''}" data-color="blue" data-i="${i}" title="Blue"></div>
        <div class="sw green ${state.colors[i] === 'green' ? 'active' : ''}" data-color="green" data-i="${i}" title="Green"></div>
        <div class="sw black ${state.colors[i] === 'black' ? 'active' : ''}" data-color="black" data-i="${i}" title="Off the board"></div>
        <div class="sw neutral ${state.colors[i] === 'neutral' ? 'active' : ''}" data-color="neutral" data-i="${i}" title="Neutral"></div>
      </div>
    `;
          grid.appendChild(cell);
        }
        grid.querySelectorAll('.wordInput').forEach((inp) => {
          inp.addEventListener('input', (e) => {
            state.words[e.target.dataset.i] = e.target.value.toUpperCase();
          });
        });
        grid.querySelectorAll('.sw').forEach((sw) => {
          sw.addEventListener('click', (e) => {
            const i = e.target.dataset.i;
            state.colors[i] = e.target.dataset.color;
            renderSetupGrid();
            renderCounts();
          });
        });
        renderCounts();
      }

      document
        .getElementById('timerDurationInput')
        .addEventListener('input', (e) => {
          const v = parseInt(e.target.value) || 60;
          state.timer.total = v;
          if (!state.timer.running) {
            state.timer.remaining = v;
          }
        });

      document.getElementById('clearReveals').addEventListener('click', () => {
        state.revealed = Array(25).fill(false);
      });

      // init
      state.timer.remaining = state.timer.total;
      updateTimerBox();
    </script>
