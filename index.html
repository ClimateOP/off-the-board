<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Off The Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #07080d;
        --panel: #10131c;
        --panel-2: #171b27;
        --line: #242a3a;
        --ink: #e7e9f2;
        --ink-dim: #8991a8;
        --blue: #3f7fc4;
        --green: #3fae74;
        --black-word: #c23b3b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: var(--void);
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
      }
      .screen {
        height: 100vh;
        width: 100vw;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background:
          radial-gradient(
            ellipse at 20% -10%,
            rgba(63, 127, 196, 0.09),
            transparent 45%
          ),
          radial-gradient(
            ellipse at 90% 110%,
            rgba(194, 59, 59, 0.07),
            transparent 45%
          ),
          var(--void);
      }
      .screen.active {
        display: flex;
      }

      h1.title {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        letter-spacing: 0.05em;
        font-size: 44px;
        margin: 0 0 48px;
        text-align: center;
      }
      h1.title span {
        color: var(--black-word);
      }

      .choice-row {
        display: flex;
        gap: 22px;
      }
      .choice-card {
        width: 220px;
        padding: 30px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .choice-card:hover {
        border-color: var(--blue);
        transform: translateY(-2px);
      }
      .choice-card .big {
        font-family: 'Cinzel', serif;
        font-size: 22px;
        margin-bottom: 8px;
      }
      .choice-card .sub {
        font-size: 13px;
        color: var(--ink-dim);
      }

      .player-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 340px;
      }
      .player-row {
        padding: 16px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .player-row:hover {
        border-color: var(--blue);
      }
      .player-row .pname {
        font-size: 18px;
      }
      .role-tag {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 2px;
      }
      .role-tag.spirit {
        background: #1c3350;
        color: #8ec1f0;
      }
      .role-tag.soul {
        background: var(--panel-2);
        color: var(--ink-dim);
        border: 1px solid var(--line);
      }

      .backlink {
        margin-top: 34px;
        font-size: 12px;
        color: var(--ink-dim);
        cursor: pointer;
        font-family: 'IBM Plex Mono', monospace;
      }
      .backlink:hover {
        color: var(--ink);
      }

      /* GAME SCREEN */
      #gameScreen {
        align-items: stretch;
        justify-content: flex-start;
        padding: 24px 40px 20px;
        position: relative;
      }

      .game-top {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 60px;
        margin-bottom: 18px;
      }
      .team-panel {
        width: 270px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .team-panel.right {
        align-items: flex-end;
      }
      .group-label {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
        margin-bottom: 6px;
      }
      .group {
      }
      .role-line {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 5px;
      }
      .team-panel.right .role-line {
        justify-content: flex-end;
      }
      .role-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }
      .role-dot.spirit {
        background: var(--blue);
      }
      .role-dot.soul {
        background: var(--ink-dim);
      }
      .pname-edit {
        font-size: 16px;
        font-weight: 600;
        outline: none;
        border-radius: 3px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .pname-edit.active-view {
        color: var(--blue);
      }
      .pname-edit[contenteditable='true'] {
        background: var(--panel-2);
        border: 1px solid var(--line);
        cursor: text;
      }

      .timer-box {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 44px;
        padding: 4px 22px;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
        background: var(--panel);
        min-width: 130px;
        text-align: center;
        outline: none;
        align-self: center;
      }
      .timer-box.paused {
        color: var(--ink-dim);
        border-color: var(--ink-dim);
      }
      .timer-box.low {
        color: var(--black-word);
        border-color: var(--black-word);
      }
      .timer-box[contenteditable='true'] {
        border-color: var(--blue);
        color: var(--ink);
      }

      .dots {
        position: absolute;
        top: 24px;
        right: 40px;
        font-size: 26px;
        color: var(--ink-dim);
        cursor: pointer;
        padding: 4px 10px;
        letter-spacing: 2px;
        line-height: 1;
        z-index: 5;
      }
      .dots:hover {
        color: var(--ink);
      }
      .dots.on {
        color: var(--blue);
      }

      .edit-pill {
        position: absolute;
        top: 28px;
        right: 78px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--blue);
        border: 1px solid var(--blue);
        padding: 3px 8px;
        border-radius: 10px;
        display: none;
      }
      .edit-pill.on {
        display: block;
      }

      .board {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 11px;
        height: calc(100vh - 310px);
        min-height: 260px;
      }
      .cell {
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--ink);
      }
      .cell.blue {
        background: linear-gradient(160deg, var(--blue), #2a5c8f);
        color: #eef5ff;
        border-color: #2a5c8f;
      }
      .cell.green {
        background: linear-gradient(160deg, var(--green), #2b7d55);
        color: #eafff2;
        border-color: #2b7d55;
      }
      .cell.black {
        background: linear-gradient(160deg, #1a1010, #000);
        color: var(--black-word);
        border-color: #3a1616;
        box-shadow: 0 0 16px rgba(194, 59, 59, 0.18) inset;
      }
      .cell-word {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.01em;
        outline: none;
        width: 100%;
      }
      .cell-word[contenteditable='true'] {
        cursor: text;
      }

      /* HINT BAR */
      .hint-bar {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px 22px;
      }
      .hint-label {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
        flex: none;
      }
      .hint-display {
        flex: 1;
        font-size: 26px;
        font-weight: 600;
        font-family: 'Cinzel', serif;
        color: var(--ink);
        outline: none;
        min-height: 34px;
        cursor: text;
        border-radius: 3px;
        padding: 2px 8px;
      }
      .hint-display:empty::before {
        content: '—';
        color: var(--ink-dim);
      }
      .hint-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .hint-input-row input {
        background: var(--void);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 9px 12px;
        border-radius: 4px;
        font-size: 14px;
        width: 220px;
        outline: none;
      }
      .hint-input-row input:focus {
        border-color: var(--blue);
      }
      .hint-send {
        background: var(--blue);
        border: none;
        color: #eef5ff;
        width: 36px;
        height: 36px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hint-send:hover {
        background: #356fac;
      }
    </style>
  </head>
  <body>
    <!-- MODE SELECT -->
    <div class="screen active" id="modeScreen">
      <h1 class="title">OFF THE <span>BOARD</span></h1>
      <div class="choice-row">
        <div class="choice-card" data-mode="duo">
          <div class="big">Duo</div>
          <div class="sub">2 players</div>
        </div>
        <div class="choice-card" data-mode="team">
          <div class="big">Team</div>
          <div class="sub">6 players</div>
        </div>
      </div>
    </div>

    <!-- PLAYER SELECT -->
    <div class="screen" id="playerScreen">
      <h1 class="title" style="font-size: 30px; margin-bottom: 34px">
        Who's playing?
      </h1>
      <div class="player-list" id="playerList"></div>
      <div class="backlink" id="backToMode">&larr; change mode</div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
      <div class="game-top">
        <div class="team-panel left" id="teamLeft"></div>
        <div class="timer-box" id="timerBox">01:00</div>
        <div class="team-panel right" id="teamRight"></div>
      </div>
      <div class="board" id="board"></div>
      <div class="hint-bar">
        <div class="hint-label">HINT</div>
        <div class="hint-display" id="hintDisplay" contenteditable="true"></div>
        <div class="hint-input-row">
          <input type="text" id="hintInput" placeholder="Type hint…" />
          <button class="hint-send" id="hintSend">&#10148;</button>
        </div>
      </div>
      <div class="edit-pill" id="editPill">EDIT MODE</div>
      <div class="dots" id="dotsMenu">&#8942;</div>
    </div>

    <script>
      // Words + colors taken from the script: black words are the 5 confirmed
      // off-the-board words Beta reads out ("WIN" "DUO" "OR" "FACE" "DEATH").
      const DEFAULT_WORDS = [
        'THINKING',
        'FURNITURE',
        'HAND',
        'GRENADE',
        'STICKY',
        'VESSEL',
        'MYTH',
        'SIGNAL',
        'BOARD',
        'JACKET',
        'LOGICAL',
        'BED',
        'COOK',
        'SITUATION',
        'PALM',
        'MORSE',
        'RECORDING',
        'BROWSER',
        'SPIRIT',
        'SOUL',
        'WIN',
        'DUO',
        'OR',
        'FACE',
        'DEATH',
      ];
      const DEFAULT_COLORS = [
        'blue',
        'blue',
        'blue',
        'blue',
        'blue',
        'blue',
        'blue',
        'blue',
        'blue',
        'blue',
        'green',
        'green',
        'green',
        'green',
        'green',
        'green',
        'green',
        'green',
        'green',
        'green',
        'black',
        'black',
        'black',
        'black',
        'black',
      ];

      let state = {
        mode: 'team',
        names: {
          duo: { p1: 'Alpha', p2: 'Beta' },
          team: {
            t1: { spirit: 'Alpha', soul1: 'Theta', soul2: 'Delta' },
            t2: { spirit: 'Beta', soul1: 'Epsilon', soul2: 'Gamma' },
          },
        },
        words: DEFAULT_WORDS.slice(),
        colors: DEFAULT_COLORS.slice(),
        revealed: Array(25).fill(false),
        selectedPlayer: null,
        editMode: false,
        hint: '',
        timer: { total: 60, remaining: 60, running: false, intervalId: null },
      };
      const COLOR_CYCLE = ['blue', 'green', 'black'];

      function getRoster() {
        if (state.mode === 'duo') {
          return [
            {
              id: 'p1',
              name: state.names.duo.p1,
              role: 'spirit',
              side: 'left',
              path: 'duo.p1',
            },
            {
              id: 'p2',
              name: state.names.duo.p2,
              role: 'soul',
              side: 'right',
              path: 'duo.p2',
            },
          ];
        }
        return [
          {
            id: 't1-spirit',
            name: state.names.team.t1.spirit,
            role: 'spirit',
            side: 'left',
            path: 'team.t1.spirit',
          },
          {
            id: 't1-soul1',
            name: state.names.team.t1.soul1,
            role: 'soul',
            side: 'left',
            path: 'team.t1.soul1',
          },
          {
            id: 't1-soul2',
            name: state.names.team.t1.soul2,
            role: 'soul',
            side: 'left',
            path: 'team.t1.soul2',
          },
          {
            id: 't2-spirit',
            name: state.names.team.t2.spirit,
            role: 'spirit',
            side: 'right',
            path: 'team.t2.spirit',
          },
          {
            id: 't2-soul1',
            name: state.names.team.t2.soul1,
            role: 'soul',
            side: 'right',
            path: 'team.t2.soul1',
          },
          {
            id: 't2-soul2',
            name: state.names.team.t2.soul2,
            role: 'soul',
            side: 'right',
            path: 'team.t2.soul2',
          },
        ];
      }

      function showScreen(id) {
        document
          .querySelectorAll('.screen')
          .forEach((s) => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      // ---- Mode select ----
      document.querySelectorAll('.choice-card').forEach((card) => {
        card.addEventListener('click', () => {
          state.mode = card.dataset.mode;
          renderPlayerList();
          showScreen('playerScreen');
        });
      });

      // ---- Player select ----
      function renderPlayerList() {
        const list = document.getElementById('playerList');
        const roster = getRoster();
        list.innerHTML = roster
          .map(
            (p) => `
    <div class="player-row" data-id="${p.id}">
      <span class="pname">${p.name}</span>
      <span class="role-tag ${p.role}">${p.role.toUpperCase()}</span>
    </div>
  `,
          )
          .join('');
        list.querySelectorAll('.player-row').forEach((row) => {
          row.addEventListener('click', () => {
            state.selectedPlayer = row.dataset.id;
            enterGame();
          });
        });
      }
      document
        .getElementById('backToMode')
        .addEventListener('click', () => showScreen('modeScreen'));

      // ---- Game screen ----
      function enterGame() {
        renderTeams();
        renderBoard();
        renderHint();
        showScreen('gameScreen');
      }

      function setPath(pathStr, value) {
        const path = pathStr.split('.');
        let ref = state.names;
        for (let i = 0; i < path.length - 1; i++) ref = ref[path[i]];
        ref[path[path.length - 1]] = value;
      }

      function renderTeams() {
        const roster = getRoster();
        ['left', 'right'].forEach((side) => {
          const box = document.getElementById(
            side === 'left' ? 'teamLeft' : 'teamRight',
          );
          const members = roster.filter((p) => p.side === side);
          const spirit = members.filter((p) => p.role === 'spirit');
          const souls = members.filter((p) => p.role === 'soul');
          let html = '';
          if (spirit.length) {
            html +=
              `<div class="group"><div class="group-label">SPIRIT</div>` +
              spirit.map(memberLine).join('') +
              `</div>`;
          }
          if (souls.length) {
            html +=
              `<div class="group"><div class="group-label">SOUL${souls.length > 1 ? 'S' : ''}</div>` +
              souls.map(memberLine).join('') +
              `</div>`;
          }
          box.innerHTML = html;
        });
        applyEditableState();
        attachNameHandlers();
      }
      function memberLine(p) {
        return `<div class="role-line">
    <span class="role-dot ${p.role}"></span>
    <span class="pname-edit ${p.id === state.selectedPlayer ? 'active-view' : ''}" data-id="${p.id}" data-path="${p.path}">${p.name}</span>
  </div>`;
      }

      function attachNameHandlers() {
        document.querySelectorAll('.pname-edit').forEach((el) => {
          el.onclick = () => {
            if (state.editMode) return;
            state.selectedPlayer = el.dataset.id;
            renderTeams();
            renderBoard();
          };
          el.oninput = () => {
            setPath(el.dataset.path, el.textContent);
          };
          el.onblur = () => {
            if (el.textContent.trim() === '') el.textContent = 'Unnamed';
            setPath(el.dataset.path, el.textContent);
          };
          el.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              el.blur();
            }
          };
        });
      }

      function renderBoard() {
        const roster = getRoster();
        const player =
          roster.find((p) => p.id === state.selectedPlayer) || roster[0];
        const isSpirit = player.role === 'spirit';
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 0; i < 25; i++) {
          const cell = document.createElement('div');
          const isRevealed = state.revealed[i];
          let cls = '';
          if (isSpirit || isRevealed || state.editMode) {
            cls = state.colors[i];
          }
          cell.className = 'cell ' + cls;
          cell.dataset.i = i;

          const wordSpan = document.createElement('span');
          wordSpan.className = 'cell-word';
          wordSpan.textContent = state.words[i];
          wordSpan.dataset.i = i;
          cell.appendChild(wordSpan);
          board.appendChild(cell);

          wordSpan.onclick = (e) => {
            if (state.editMode) {
              e.stopPropagation();
            }
          };
          wordSpan.oninput = () => {
            state.words[i] = wordSpan.textContent.toUpperCase();
          };
          wordSpan.onblur = () => {
            if (wordSpan.textContent.trim() === '') {
              wordSpan.textContent = 'WORD';
            }
            state.words[i] = wordSpan.textContent.toUpperCase();
          };
          wordSpan.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              wordSpan.blur();
            }
          };

          cell.onclick = (e) => {
            if (state.editMode) {
              if (e.target === wordSpan) return;
              const cur = state.colors[i];
              const next =
                COLOR_CYCLE[
                  (COLOR_CYCLE.indexOf(cur) + 1) % COLOR_CYCLE.length
                ];
              state.colors[i] = next;
              renderBoard();
            } else {
              state.revealed[i] = !state.revealed[i];
              renderBoard();
            }
          };
        }
        applyEditableState();
      }

      function applyEditableState() {
        document.querySelectorAll('.pname-edit').forEach((el) => {
          el.contentEditable = state.editMode ? 'true' : 'false';
        });
        document.querySelectorAll('.cell-word').forEach((el) => {
          el.contentEditable = state.editMode ? 'true' : 'false';
        });
        timerBox.contentEditable = state.editMode ? 'true' : 'false';
      }

      // ---- Hint bar ----
      const hintDisplay = document.getElementById('hintDisplay');
      const hintInput = document.getElementById('hintInput');
      function renderHint() {
        hintDisplay.textContent = state.hint;
      }
      hintDisplay.addEventListener('input', () => {
        state.hint = hintDisplay.textContent;
      });
      hintDisplay.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          hintDisplay.blur();
        }
      });

      function sendHint() {
        const val = hintInput.value.trim();
        if (!val) return;
        state.hint = val;
        hintDisplay.textContent = state.hint;
        hintInput.value = '';
      }
      document.getElementById('hintSend').addEventListener('click', sendHint);
      hintInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendHint();
        }
      });

      // ---- Timer (mm:ss) ----
      const timerBox = document.getElementById('timerBox');
      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }
      function parseTime(str) {
        const cleaned = str.trim();
        if (cleaned.includes(':')) {
          const [m, s] = cleaned.split(':').map((n) => parseInt(n) || 0);
          return m * 60 + s;
        }
        const n = parseInt(cleaned.replace(/\D/g, ''));
        return isNaN(n) ? state.timer.total : n;
      }
      function updateTimerBox() {
        if (document.activeElement !== timerBox) {
          timerBox.textContent = formatTime(state.timer.remaining);
        }
        timerBox.classList.toggle(
          'low',
          state.timer.remaining <= 10 && state.timer.running,
        );
        timerBox.classList.toggle('paused', !state.timer.running);
      }
      function tick() {
        if (state.timer.remaining > 0) {
          state.timer.remaining -= 1;
        } else {
          state.timer.remaining = state.timer.total;
        }
        updateTimerBox();
      }
      function startTimer() {
        if (state.timer.running) return;
        state.timer.running = true;
        state.timer.intervalId = setInterval(tick, 1000);
        updateTimerBox();
      }
      function pauseTimer() {
        clearInterval(state.timer.intervalId);
        state.timer.running = false;
        updateTimerBox();
      }
      timerBox.addEventListener('click', () => {
        if (state.editMode) return;
        if (state.timer.running) pauseTimer();
        else startTimer();
      });
      timerBox.addEventListener('blur', () => {
        const v = parseTime(timerBox.textContent);
        state.timer.total = v;
        if (!state.timer.running) state.timer.remaining = v;
        updateTimerBox();
      });
      timerBox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          timerBox.blur();
        }
      });

      // ---- Edit mode toggle ----
      const dotsMenu = document.getElementById('dotsMenu');
      const editPill = document.getElementById('editPill');
      dotsMenu.addEventListener('click', () => {
        state.editMode = !state.editMode;
        dotsMenu.classList.toggle('on', state.editMode);
        editPill.classList.toggle('on', state.editMode);
        if (state.editMode) pauseTimer();
        renderTeams();
        renderBoard();
      });

      // init
      state.timer.remaining = state.timer.total;
      updateTimerBox();
    </script>
  </body>
</html>
